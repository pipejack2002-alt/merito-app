<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="16" y1="16" x2="48" y2="48" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="28" y1="6" x2="36" y2="16" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0284c7" flood-opacity="0.35"/>
    </filter>
  </defs>
  
  <!-- Squircle Base -->
  <rect width="64" height="64" rx="16" fill="url(#bgGrad)" />
  <rect x="1" y="1" width="62" height="62" rx="15" stroke="rgba(255,255,255,0.12)" stroke-width="1.5" />
  
  <!-- Subtle Merit Star -->
  <polygon points="32,7 34.5,12 40,12.5 36,16 37,21.5 32,18.8 27,21.5 28,16 24,12.5 29.5,12" fill="url(#goldGrad)" />
  
  <!-- Elegant Bold 'M' for Mérito -->
  <path d="M15 50 V26 H21 L32 41 L43 26 H49 V50 H43.5 V35 L34 47 H30 L20.5 35 V50 Z" 
        fill="url(#accentGrad)" 
        filter="url(#glow)" />
  <path d="M16 49 V27 H20.5 L32 42.5 L43.5 27 H48 V49 H44 V34 L33.5 48 H30.5 L20 34 V49 Z" 
        fill="#ffffff" 
        opacity="0.9" />
</svg>
